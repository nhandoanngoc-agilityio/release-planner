[project]
name = "release-planner"
version = "0.0.1"
description = "Plan marketing for indie film releases. Practice product for the Claude Code training."
requires-python = ">=3.11"
# Product dependencies (FastAPI, Jinja, HTMX) arrive on Day 13 with the baseline.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
